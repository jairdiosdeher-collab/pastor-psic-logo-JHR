<button class="music-btn" id="btnMusica">🎵 Música</button>

<script>
let ctx;
let osc1,osc2,gain;
let activo=false;

document.getElementById("btnMusica").addEventListener("click",async()=>{

if(!ctx){
ctx=new(window.AudioContext||window.webkitAudioContext)();
await ctx.resume();

gain=ctx.createGain();
gain.gain.value=0.02;

osc1=ctx.createOscillator();
osc2=ctx.createOscillator();

osc1.type="sine";
osc2.type="sine";

osc1.frequency.value=261.63;
osc2.frequency.value=329.63;

osc1.connect(gain);
osc2.connect(gain);
gain.connect(ctx.destination);

osc1.start();
osc2.start();

activo=true;

}else{

if(ctx.state==="running"){
ctx.suspend();
}else{
ctx.resume();
}

}

});
</script>
