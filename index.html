
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastor Psicólogo Jair Hernández</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.7)),
url('https://images.unsplash.com/photo-1504052434569-70ad5836ab65');
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
text-align:center;
}

section{
padding:20px;
margin:15px auto;
background:rgba(0,0,0,0.6);
border-radius:12px;
width:90%;
max-width:500px;
}

.music-btn{
position:fixed;
bottom:15px;
right:15px;
background:#0d3b66;
color:white;
padding:12px;
border:none;
border-radius:30px;
font-size:14px;
z-index:999;
}
</style>
</head>

<body>

<section>
<h1>Pastor Psicólogo Jair Hernández</h1>
<p>Consejería Pastoral y Orientación Psicológica</p>
</section>

<button class="music-btn" id="btnMusica">🎵 Activar Música</button>

<script>
let ctx=null;
let osc=null;
let gain=null;

document.getElementById("btnMusica").addEventListener("click",async()=>{

if(!ctx){

ctx=new(window.AudioContext||window.webkitAudioContext)();

await ctx.resume(); // 🔑 DESPIERTA EL AUDIO

osc=ctx.createOscillator();
gain=ctx.createGain();

osc.type="sine";
osc.frequency.value=396;

gain.gain.value=0.02;

osc.connect(gain);
gain.connect(ctx.destination);

osc.start();

}else{

if(ctx.state==="running"){
ctx.suspend();
}else{
ctx.resume();
}

}

});
</script>

</body>
</html>
