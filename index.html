<script>
let ctx;
let started=false;

function startWorshipMusic(){

if(started) return;

ctx=new(window.AudioContext||window.webkitAudioContext)();

let gain=ctx.createGain();
gain.gain.value=0.02;
gain.connect(ctx.destination);

function createPad(freq){
let osc=ctx.createOscillator();
osc.type="sine";
osc.frequency.value=freq;
osc.connect(gain);
osc.start();
return osc;
}

createPad(261.63); // Do
createPad(329.63); // Mi
createPad(392.00); // Sol

started=true;
}

document.body.addEventListener("click",startWorshipMusic);
document.body.addEventListener("touchstart",startWorshipMusic);
