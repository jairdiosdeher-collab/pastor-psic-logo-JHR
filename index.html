<script>

if ('serviceWorker' in navigator) {
 navigator.serviceWorker.register('service-worker.js');
}

let musica = document.getElementById("musicaFondo");
let reproduciendo = false;

function toggleMusica(){
 if(!reproduciendo){
  musica.volume = 0.12;
  musica.play();
  reproduciendo = true;
  document.querySelector(".music-btn").innerText = "🔇 Pausar";
 } else {
  musica.pause();
  reproduciendo = false;
  document.querySelector(".music-btn").innerText = "🎵 Música";
 }
}
